<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0d0628;
        color: white;
      }

      body {
        position: relative;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Vertical label */
      .side-label {
        position: fixed;
        left: 32px;
        top: 50%;
        transform: translateY(-50%) rotate(180deg);
        writing-mode: vertical-rl;
        text-transform: lowercase;
        font-size: clamp(5rem, 11vw, 10rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        line-height: 0.85;
        color: rgba(255, 255, 255, 0.23);
        user-select: none;
        pointer-events: none;
        z-index: 0;
      }

      .page {
        width: min(96vw, 1200px);
        height: 100vh;
        display: grid;
        grid-template-rows: 1fr auto;
        padding: 1rem;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      .grid-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 0;
      }

      .grid {
        /* Keeps the full 3x3 grid inside the viewport with room for the back button */
        width: min(76vw, 860px, calc((100vh - 150px) * 0.95));
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.65rem;
      }

      .grid img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        display: block;
        cursor: pointer;
        border-radius: 8px;

        box-shadow:
          0 0 18px rgba(255, 255, 255, 0.18),
          0 0 40px rgba(255, 255, 255, 0.12),
          0 10px 28px rgba(255, 255, 255, 0.1);

        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .grid img:hover {
        transform: translateY(-2px);
        box-shadow:
          0 0 14px rgba(255, 255, 255, 0.12),
          0 0 32px rgba(255, 255, 255, 0.08),
          0 10px 24px rgba(255, 255, 255, 0.08);
      }

      .home-link {
        width: 100%;
        text-align: center;
        padding-bottom: 0.5rem;
      }

      .home-link img {
        width: clamp(56px, 8vh, 100px);
        height: clamp(56px, 8vh, 100px);
        display: inline-block;
      }

      .home-link a {
        color: rgba(255, 255, 255, 0.9);
        text-decoration: none;
        font-size: 1rem;
        letter-spacing: 0.03em;
      }

      .home-link a:hover {
        text-decoration: underline;
      }

      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 1000;
        padding: 2rem;
      }

      .lightbox.active {
        opacity: 1;
        pointer-events: auto;
      }

      .lightbox-panel {
        position: relative;
        width: min(90vw, 1100px);
        height: min(85vh, 800px);
        background: rgba(20, 20, 30, 0.95);
        border-radius: 14px;
        padding: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      .lightbox-panel img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 8px;
        cursor: pointer;
      }

      .close-btn {
        position: absolute;
        top: 0.75rem;
        right: 1rem;
        background: none;
        border: 0;
        color: white;
        font-size: 2rem;
        cursor: pointer;
        opacity: 0.7;
      }

      .close-btn:hover {
        opacity: 1;
      }

      /* Tablet */
      @media (max-width: 900px) {
        .page {
          width: min(96vw, 980px);
        }

        .grid {
          width: min(88vw, 760px, calc((100vh - 140px) * 0.95));
        }
      }

      /* Mobile */
      @media (max-width: 600px) {
        body {
          align-items: flex-start;
        }

        .side-label {
          display: none;
        }

        .page {
          width: 100vw;
          height: auto;
          min-height: auto;
          display: flex;
          flex-direction: column;
          padding: 1rem;
        }

        .grid-wrap {
          align-items: flex-start;
        }

        .grid {
          width: 100%;
          grid-template-columns: 1fr;
        }

        .home-link {
          margin-top: 1rem;
        }

        .grid img {
          aspect-ratio: auto;
          cursor: default;
        }

        @media (hover: none) {
          .grid img:hover {
            transform: none;
            box-shadow:
              0 0 18px rgba(255, 255, 255, 0.18),
              0 0 40px rgba(255, 255, 255, 0.12),
              0 10px 28px rgba(255, 255, 255, 0.1);
          }
        }
      }
    </style>
  </head>

  <body>
    <div class="side-label">images</div>

    <main class="page">
      <div class="grid-wrap">
        <div class="grid">
          <img src="images/fulls/image/mona-lisa-768.jpg" alt="" />
          <img src="images/fulls/image/puzzle.jpg" alt="" />
          <img src="images/fulls/image/birthday-card.jpg" alt="" />
          <img src="images/fulls/image/icon-examples.png" alt="" />
          <img src="images/fulls/image/tiger_thumb2.jpg" alt="" />
          <img src="images/fulls/image/cartoon-768.jpg" alt="" />
          <img src="images/fulls/image/mona_thumb.jpg" alt="" />
          <img src="images/fulls/image/dispersion.jpg" alt="" />
          <img src="images/fulls/image/fish0.jpg" alt="" />
        </div>
      </div>

      <div class="home-link">
        <a href="index.html">
          <img
            src="images\fulls\back-arrow.png"
            alt="Home"
            style="width: 100px; height: 100px"
          />
        </a>
      </div>
    </main>

    <div class="lightbox" id="lightbox">
      <div class="lightbox-panel">
        <button class="close-btn" id="closeBtn">×</button>
        <img src="" id="lightboxImg" alt="" />
      </div>
    </div>

    <script>
      const images = document.querySelectorAll(".grid img");
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightboxImg");
      const closeBtn = document.getElementById("closeBtn");
      const mobileBreakpoint = window.matchMedia("(max-width: 600px)");

      let currentIndex = 0;

      function openLightbox(index) {
        if (mobileBreakpoint.matches) return;
        currentIndex = index;
        lightboxImg.src = images[currentIndex].src;
        lightbox.classList.add("active");
      }

      function closeLightbox() {
        lightbox.classList.remove("active");
      }

      function showNextImage() {
        currentIndex = (currentIndex + 1) % images.length;
        lightboxImg.src = images[currentIndex].src;
      }

      function showPrevImage() {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        lightboxImg.src = images[currentIndex].src;
      }

      images.forEach((img, index) => {
        img.addEventListener("click", () => openLightbox(index));
      });

      closeBtn.addEventListener("click", closeLightbox);

      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      lightboxImg.addEventListener("click", showNextImage);

      document.addEventListener("keydown", (e) => {
        if (!lightbox.classList.contains("active")) return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowRight") showNextImage();
        if (e.key === "ArrowLeft") showPrevImage();
      });
    </script>
  </body>
</html>
