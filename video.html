<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>

    <style>
      html {
        scroll-behavior: smooth;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: linear-gradient(to bottom, #08023b 0%, #42027e 100%);
        color: #fff;
        min-height: 100vh;
        position: relative;
      }

      .side-label {
        position: fixed;
        left: 32px;
        top: 50%;
        transform: translateY(-50%) rotate(180deg);
        writing-mode: vertical-rl;
        text-transform: uppercase;
        font-size: clamp(5rem, 11vw, 10rem);
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 0.85;
        color: rgba(255, 255, 255, 0.13);
        user-select: none;
        pointer-events: none;
        z-index: 0;
      }

      .mobile-title {
        display: none;
        margin: 0;
        color: #ffffff;
        font-size: clamp(1.8rem, 3vw, 2.4rem);
        font-weight: 350;
        text-align: center;
        letter-spacing: 0.04em;
        text-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      }

      .main-content {
        width: 100%;
        display: flex;
        justify-content: center;
        position: relative;
        z-index: 1;
      }

      .page-body {
        width: 100%;
        max-width: 1100px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .video-group {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 32px 24px;
      }

      .video-placeholder {
        width: min(66vw, 1000px);
        aspect-ratio: 16 / 9;
        border-radius: 14px;
        overflow: hidden;
        box-shadow:
          0 0 18px rgba(190, 220, 255, 0.2),
          0 0 38px rgba(168, 200, 255, 0.16),
          0 18px 40px rgba(0, 0, 0, 0.35);
      }

      .video-placeholder iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      .down-arrow {
        width: 40px;
        height: 40px;
        border-right: 3px solid #a8c8ff;
        border-bottom: 3px solid #a8c8ff;
        transform: rotate(45deg);
        cursor: pointer;
        margin-top: 6px;
        transition:
          transform 0.2s ease,
          opacity 0.2s ease;
        opacity: 0.6;
      }

      .down-arrow:hover {
        transform: rotate(45deg) translateY(4px);
        opacity: 1;
      }

      .video-group:last-child .down-arrow {
        opacity: 0.25;
      }

      @media (max-width: 768px) {
        .side-label {
          display: none;
        }

        .mobile-title {
          display: block;
          width: 90vw;
          padding-top: 28px;
        }

        .page-body {
          gap: 80px;
          padding-bottom: 60px;
        }

        .video-group {
          min-height: auto;
          padding: 0;
          gap: 28px;
        }

        .video-placeholder {
          width: 90vw;
        }
      }
    </style>
  </head>

  <body>
    <div class="side-label">video</div>

    <main class="main-content">
      <div class="page-body">
        <h1 class="mobile-title">video</h1>

        <div class="video-group">
          <div class="video-placeholder">
            <iframe
              src="https://www.youtube.com/embed/QojrYqCmMSo"
              allowfullscreen
            ></iframe>
          </div>

          <div class="down-arrow"></div>
        </div>

        <div class="video-group">
          <div class="video-placeholder">
            <iframe
              src="https://www.youtube.com/embed/Kx6yNT7UE8U"
              allowfullscreen
            ></iframe>
          </div>

          <div class="down-arrow"></div>
        </div>

        <div class="video-group">
          <div class="video-placeholder">
            <iframe
              src="https://www.youtube.com/embed/lc9GP98I4cA"
              allowfullscreen
            ></iframe>
          </div>
          <div class="home-link">
            <a href="index.html">
              <img
                src="images\fulls\back-arrow.png"
                alt="Home"
                style="width: 100px; height: 100px"
              />
            </a>
          </div>
          <!--<div class="down-arrow"></div>-->
        </div>
        <div class="video-group">
          <div class="video-placeholder">
            <iframe
              src="https://www.youtube.com/embed/xRvp1MZrNpY"
              allowfullscreen
            ></iframe>
          </div>
          <div class="home-link">
            <a href="index.html">
              <img
                src="images\fulls\back-arrow.png"
                alt="Home"
                style="width: 100px; height: 100px"
              />
            </a>
          </div>
          <!--<div class="down-arrow"></div>-->
        </div>
      </div>
    </main>

    <script>
      document.querySelectorAll(".down-arrow").forEach((arrow) => {
        arrow.addEventListener("click", () => {
          const block = arrow.closest(".video-group");
          const nextBlock = block.nextElementSibling;

          if (!nextBlock || !nextBlock.classList.contains("video-group"))
            return;

          const target = nextBlock.querySelector(".video-placeholder");
          if (!target) return;

          const rect = target.getBoundingClientRect();
          const targetTop =
            window.pageYOffset +
            rect.top -
            (window.innerHeight - rect.height) / 2;

          window.scrollTo({
            top: targetTop,
            behavior: "smooth",
          });
        });
      });
    </script>
  </body>
</html>
