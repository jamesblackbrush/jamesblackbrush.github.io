<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom, #08023b 0%, #42027e 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .video-placeholder {
        width: 66vw;
        aspect-ratio: 16 / 9;
      }
    </style>
  </head>
  <body>
    <iframe
      src="https://www.youtube.com/embed/Kx6yNT7UE8U"
      width="100%"
      height="100%"
      frameborder="0"
      allowfullscreen
      class="video-placeholder"
    >
    </iframe>
  </body>
</html>
