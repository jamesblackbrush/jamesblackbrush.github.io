<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>
    <style>
      body {
        margin: 0;
        padding: 60px 0 40px;
        background: linear-gradient(to bottom, #08023b 0%, #42027e 100%);
        min-height: 100vh;
        display: flex;
        justify-content: flex-start;
        align-items: center;
      }

      .page-body {
        width: 100%;
        max-width: 1200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 60px;
      }

      .video-group {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .video-placeholder {
        width: 66vw;
        max-width: 1200px;
        aspect-ratio: 16 / 9;
      }

      .video-placeholder iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      .description-box {
        width: 66vw;
        max-width: 1200px;
        padding: 18px 20px;
        border: 1px solid rgba(173, 216, 230, 0.9);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.06);
        color: #e8f2ff;
        line-height: 1.6;
      }

      .down-arrow {
        width: 32px;
        height: 32px;
        border-right: 3px solid #a8c8ff;
        border-bottom: 3px solid #a8c8ff;
        transform: rotate(45deg);
        margin-top: 10px;
      }

      @media (max-width: 768px) {
        body {
          padding: 40px 0 30px;
        }

        .video-placeholder,
        .description-box {
          width: 90vw;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-body">
      <!-- Video block 1 -->
      <div class="video-group">
        <div class="video-placeholder">
          <iframe
            src="https://www.youtube.com/embed/Kx6yNT7UE8U"
            frameborder="0"
            allowfullscreen
          ></iframe>
        </div>

        <div class="description-box">
          This is a short placeholder description for the video. Replace this text with one or two sentences explaining the content of the video.
        </div>

        <div class="down-arrow" role="img" aria-label="scroll down"></div>
      </div>

      <!-- Video block 2 (duplicate this entire block to add another section) -->
      <div class="video-group">
        <div class="video-placeholder">
          <iframe
            src="https://www.youtube.com/embed/Kx6yNT7UE8U"
            frameborder="0"
            allowfullscreen
          ></iframe>
        </div>

        <div class="description-box">
          This is a second placeholder description. Duplicate this block and update the video and text to add more videos below.
        </div>

        <div class="down-arrow" role="img" aria-label="scroll down"></div>
      </div>
    </div>
  </body>
</html>
