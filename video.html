<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom, #08023b 0%, #42027e 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .video-placeholder {
        width: 66vw;
        max-width: 1200px;
        aspect-ratio: 16 / 9;
      }

      .video-placeholder iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="video-placeholder">
      <iframe
        src="https://www.youtube.com/embed/Kx6yNT7UE8U"
        frameborder="0"
        allowfullscreen
      ></iframe>
    </div>
  </body>
</html>
