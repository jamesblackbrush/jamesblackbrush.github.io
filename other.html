<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Image Background</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0d0628;
        font-family: system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .image-grid {
        width: min(100vw, 100vh);
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 0;
        padding: 0;
      }

      .image-grid img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        display: block;
        cursor: pointer;
        border-radius: 0;
        transition: filter 0.2s ease;
      }

      @media (hover: hover) {
        .image-grid img:hover {
          filter: brightness(1.25);
        }
      }

      /* Exactly 4 items → 2x2 */
      .image-grid:has(> img:nth-child(4):last-child) {
        grid-template-columns: repeat(2, 1fr);
      }

      /* Exactly 9 items → 3x3 */
      .image-grid:has(> img:nth-child(9):last-child) {
        grid-template-columns: repeat(3, 1fr);
      }

      /* Larger sets keep at least 4 across on desktop */
      @media (min-width: 1200px) {
        .image-grid:not(:has(> img:nth-child(4):last-child)):not(
            :has(> img:nth-child(9):last-child)
          ) {
          width: 100vw;
          grid-template-columns: repeat(4, 1fr);
        }
      }

      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 1000;
        padding: 2rem;
      }

      .lightbox.active {
        opacity: 1;
        pointer-events: auto;
      }

      .lightbox-panel {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* EDIT THESE VALUES FOR IMAGE LIGHTBOX SIZE */
      .lightbox-panel.image-mode {
        width: min(80vw, 800px);
        aspect-ratio: 1 / 1;
      }

      /* EDIT THESE VALUES FOR VIDEO LIGHTBOX SIZE */
      .lightbox-panel.video-mode {
        width: min(85vw, 1100px);
        aspect-ratio: 16 / 9;
      }

      .lightbox-panel img,
      .lightbox-panel iframe {
        width: 100%;
        height: 100%;
        border: 0;
        object-fit: contain;
      }

      .close-btn {
        position: absolute;
        top: -14px;
        right: -14px;
        background: #111;
        border: 0;
        color: white;
        font-size: 1.8rem;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        z-index: 2;
      }

      .close-btn:hover {
        background: #333;
      }

      .floating-back-btn {
        position: fixed;
        left: 24px;
        bottom: 24px;
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(150, 241, 114, 0.8);
        box-shadow:
          0 0 18px rgba(255, 255, 255, 0.18),
          0 10px 28px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(6px);
        cursor: pointer;
        z-index: 900;
        animation: backPulse 2.2s ease-in-out infinite;
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }

      .floating-back-btn:hover {
        transform: scale(1.08);
        background: rgba(150, 241, 114);
      }

      .floating-back-btn img {
        width: 48px;
        height: 48px;
        display: block;
      }

      @keyframes backPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.78;
        }

        50% {
          transform: scale(1.06);
          opacity: 1;
        }
      }

      @media (max-width: 600px) {
        body {
          display: block;
        }

        .image-grid,
        .image-grid:has(> img:nth-child(4):last-child),
        .image-grid:has(> img:nth-child(9):last-child) {
          width: 100%;
          grid-template-columns: 1fr;
        }

        .floating-back-btn {
          width: 58px;
          height: 58px;
          left: 16px;
          bottom: 16px;
        }

        .floating-back-btn img {
          width: 38px;
          height: 38px;
        }
      }
    </style>
  </head>

  <body>
    <div class="image-grid">
      <img
        src="images/fulls/other/mars-preview.jpg"
        data-type="image"
        data-full-src="images/fulls/other/mars-full.png"
      />

      <img
        src="images/fulls/other/elearning-thumbnail.png"
        data-type="video"
        data-video-url="https://www.youtube.com/embed/K8cq27UeGWc"
      />

      <img
        src="images/fulls/other/takeAwayMenu.jpg"
        data-type="image"
        data-full-src="images/fulls/other/menu-full.png"
      />

      <img
        src="images/fulls/other/html-video.png"
        data-type="video"
        data-video-url="https://www.youtube.com/embed/8DGs_J0kriU"
      />

      <!--
      <img src="images/fulls/other/image.jpg" data-type="image" />
     
      <img
        src="images/fulls/other/video.jpg"
        data-type="video"
        data-video-url="https://www.youtube.com/embed/Kx6yNT7UE8U"
      />

      <img src="images/fulls/other/image.jpg" data-type="image" />

      <img
        src="images/fulls/other/video.jpg"
        data-type="video"
        data-video-url="https://www.youtube.com/embed/Kx6yNT7UE8U"
      />
      <img
        src="images/fulls/other/video.jpg"
        data-type="video"
        data-video-url="https://www.youtube.com/embed/Kx6yNT7UE8U"
      />

      <img src="images/fulls/other/image.jpg" data-type="image" />

      <img
        src="images/fulls/other/video.jpg"
        data-type="video"
        data-video-url="https://www.youtube.com/embed/Kx6yNT7UE8U"
      />

      <img src="images/fulls/other/image.jpg" data-type="image" />

      <img
        src="images/fulls/other/video.jpg"
        data-type="video"
        data-video-url="https://www.youtube.com/embed/Kx6yNT7UE8U"
      />

      <img src="images/fulls/other/image.jpg" data-type="image" />

      <img
        src="images/fulls/other/video.jpg"
        data-type="video"
        data-video-url="https://www.youtube.com/embed/Kx6yNT7UE8U"
      />
    --></div>

    <button class="floating-back-btn" id="floatingBackBtn" aria-label="Go back">
      <img src="images/fulls/back-arrow.png" alt="" />
    </button>

    <div class="lightbox" id="lightbox">
      <div class="lightbox-panel image-mode" id="lightboxPanel">
        <button class="close-btn" id="closeBtn">×</button>

        <img id="lightboxImg" src="" alt="" />

        <iframe
          id="lightboxVideo"
          src=""
          allow="autoplay; encrypted-media"
          allowfullscreen
          style="display: none"
        ></iframe>
      </div>
    </div>

    <script>
      const tiles = document.querySelectorAll(".image-grid img");
      const lightbox = document.getElementById("lightbox");
      const lightboxPanel = document.getElementById("lightboxPanel");
      const lightboxImg = document.getElementById("lightboxImg");
      const lightboxVideo = document.getElementById("lightboxVideo");
      const closeBtn = document.getElementById("closeBtn");
      const floatingBackBtn = document.getElementById("floatingBackBtn");

      tiles.forEach((tile) => {
        tile.addEventListener("click", () => {
          const type = tile.dataset.type || "image";

          lightboxPanel.classList.remove("image-mode", "video-mode");

          if (type === "video") {
            lightboxPanel.classList.add("video-mode");

            lightboxImg.style.display = "none";
            lightboxImg.src = "";

            lightboxVideo.style.display = "block";
            lightboxVideo.src = tile.dataset.videoUrl + "?autoplay=1";
          } else {
            lightboxPanel.classList.add("image-mode");

            lightboxVideo.style.display = "none";
            lightboxVideo.src = "";

            lightboxImg.style.display = "block";
            // For image tiles, src is the visible thumbnail/tile.
            // data-full-src is the different image that opens in the lightbox.
            // If data-full-src is omitted, it falls back to the tile image.
            lightboxImg.src = tile.dataset.fullSrc || tile.src;
          }

          lightbox.classList.add("active");
        });
      });

      function closeLightbox() {
        lightbox.classList.remove("active");
        lightboxImg.src = "";
        lightboxVideo.src = "";
      }

      floatingBackBtn.addEventListener("click", () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "index.html";
        }
      });

      closeBtn.addEventListener("click", closeLightbox);

      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
      });
    </script>
  </body>
</html>
