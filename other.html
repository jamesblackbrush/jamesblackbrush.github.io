<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Image Background</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0d0628;
        font-family: system-ui, sans-serif;
      }

      .image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 0;
        padding: 0;
      }

      .image-grid img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        display: block;
        cursor: pointer;
        border-radius: 0;
        transition: filter 0.2s ease;
      }

      @media (hover: hover) {
        .image-grid img:hover {
          filter: brightness(1.25);
        }
      }

      @media (min-width: 1200px) {
        .image-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* Default (fallback) */
      .image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }

      /* Exactly 4 items → 2x2 */
      .image-grid:has(> img:nth-child(4):last-child) {
        grid-template-columns: repeat(2, 1fr);
      }

      /* Exactly 9 items → 3x3 */
      .image-grid:has(> img:nth-child(9):last-child) {
        grid-template-columns: repeat(3, 1fr);
      }

      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 1000;
        padding: 2rem;
      }

      .lightbox.active {
        opacity: 1;
        pointer-events: auto;
      }

      .lightbox-panel {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* EDIT THESE VALUES FOR IMAGE LIGHTBOX SIZE */
      .lightbox-panel.image-mode {
        width: min(80vw, 800px);
        aspect-ratio: 1 / 1;
      }

      /* EDIT THESE VALUES FOR VIDEO LIGHTBOX SIZE */
      .lightbox-panel.video-mode {
        width: min(85vw, 1100px);
        aspect-ratio: 16 / 9;
      }

      .lightbox-panel img,
      .lightbox-panel iframe {
        width: 100%;
        height: 100%;
        border: 0;
        object-fit: contain;
      }

      .close-btn {
        position: absolute;
        top: -14px;
        right: -14px;
        background: #111;
        border: 0;
        color: white;
        font-size: 1.8rem;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        z-index: 2;
      }

      .close-btn:hover {
        background: #333;
      }

      @media (max-width: 600px) {
        .image-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>

  <body>
    <div class="image-grid">
      <img src="images/fulls/other/image.jpg" data-type="image" />

      <img
        src="images/fulls/other/video.jpg"
        data-type="video"
        data-video-url="https://www.youtube.com/embed/Kx6yNT7UE8U"
      />

      <img src="images/fulls/other/image.jpg" data-type="image" />

      <img
        src="images/fulls/other/video.jpg"
        data-type="video"
        data-video-url="https://www.youtube.com/embed/Kx6yNT7UE8U"
      />

        src="images/fulls/other/video.jpg"
        data-type="video"
        data-video-url="https://www.youtube.com/embed/Kx6yNT7UE8U"
      />
    --></div>

    <div class="lightbox" id="lightbox">
      <div class="lightbox-panel image-mode" id="lightboxPanel">
        <button class="close-btn" id="closeBtn">×</button>

        <img id="lightboxImg" src="" alt="" />

        <iframe
          id="lightboxVideo"
          src=""
          allow="autoplay; encrypted-media"
          allowfullscreen
          style="display: none"
        ></iframe>
      </div>
    </div>

    <script>
      const tiles = document.querySelectorAll(".image-grid img");
      const lightbox = document.getElementById("lightbox");
      const lightboxPanel = document.getElementById("lightboxPanel");
      const lightboxImg = document.getElementById("lightboxImg");
      const lightboxVideo = document.getElementById("lightboxVideo");
      const closeBtn = document.getElementById("closeBtn");

      tiles.forEach((tile) => {
        tile.addEventListener("click", () => {
          const type = tile.dataset.type || "image";

          lightboxPanel.classList.remove("image-mode", "video-mode");

          if (type === "video") {
            lightboxPanel.classList.add("video-mode");

            lightboxImg.style.display = "none";
            lightboxImg.src = "";

            lightboxVideo.style.display = "block";
            lightboxVideo.src = tile.dataset.videoUrl + "?autoplay=1";
          } else {
            lightboxPanel.classList.add("image-mode");

            lightboxVideo.style.display = "none";
            lightboxVideo.src = "";

            lightboxImg.style.display = "block";
            lightboxImg.src = tile.src;
          }

          lightbox.classList.add("active");
        });
      });

      function closeLightbox() {
        lightbox.classList.remove("active");
        lightboxImg.src = "";
        lightboxVideo.src = "";
      }

      closeBtn.addEventListener("click", closeLightbox);

      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
      });
    </script>
  </body>
