<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blackbrush</title>
    <meta
      name="description"
      content="A quiet place for finished experiments."
    />

    <style>
      :root {
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.72);
        --panel: rgba(0, 0, 0, 0.35);
        --scrim: rgba(0, 0, 0, 0.45);
        --border: rgba(255, 255, 255, 0.14);
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, sans-serif;
      }

      /* Fullscreen hero */
      .hero {
        position: relative;
        height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
      }

      /* Background video */
      .hero video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* fills screen, may crop edges (desired for background) */
        object-position: center;
        filter: contrast(1.05) saturate(1.05);
        transform: scale(
          1.02
        ); /* tiny scale helps avoid edge gaps on some devices */
      }

      /* Dark overlay to improve text readability */
      .scrim {
        position: absolute;
        inset: 0;
        background: var(--scrim);
        z-index: 1;
      }

      /* Optional subtle vignette */
      .vignette {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0.25) 55%,
          rgba(0, 0, 0, 0.55) 100%
        );
        mix-blend-mode: multiply;
      }

      /* Overlay content */
      .content {
        position: relative;
        z-index: 3;
        width: min(820px, calc(100% - 2rem));
        padding: 2rem;
      }

      /* Glass panel */
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 2.25rem 2.25rem 1.75rem;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 0.6rem 0;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: -0.02em;
        line-height: 1.05;
      }

      p {
        margin: 0.25rem 0 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 1.6vw, 1.15rem);
        line-height: 1.5;
      }

      .nav {
        margin-top: 1.25rem;
        display: flex;
        gap: 0.85rem;
        flex-wrap: wrap;
      }

      .nav a {
        display: inline-block;
        padding: 0.55rem 0.85rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        text-decoration: none;
        transition: transform 120ms ease, background 120ms ease,
          border-color 120ms ease;
      }

      .nav a:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.25);
      }

      .footer {
        margin-top: 1rem;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.55);
      }

      /* Reduce motion for users who prefer it */
      @media (prefers-reduced-motion: reduce) {
        .hero video {
          display: none;
        }
        .hero {
          background: #0b0b0b;
        }
      }
    </style>
  </head>

  <body>
    <main class="hero">
      <!-- Background loop video -->
      <video autoplay muted loop playsinline preload="metadata" poster="">
        <!-- Use one source to start; you can add a .webm later for even smaller files -->
        <source src="video/loop.mp4" type="video/mp4" />
        <!-- Fallback text (rarely seen) -->
        Your browser does not support the video tag.
      </video>

      <div class="scrim"></div>
      <div class="vignette"></div>

      <!-- Overlay content -->
      <section class="content" aria-label="Site intro">
        <div class="panel">
          <h1>Blackbrush</h1>
          <p>
            A quiet place for finished experiments — AI video, After Effects,
            images, and odd little tests.
          </p>

          <nav class="nav" aria-label="Primary navigation">
            <a href="/work/">Work</a>
            <a href="/experiments/">Experiments</a>
            <a href="/about/">About</a>
          </nav>

          <div class="footer">
            <span>© <span id="year"></span> James Blackbrush</span>
          </div>
        </div>
      </section>
    </main>

    <script>
      // Tiny touch: keep the year current.
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
