    <script>
      /*
        Lightbox behaviour tweak:
        - The existing gallery/lightbox still opens and advances as before.
        - Once the user has clicked through the lightbox images, the next click
          sends them to that panel's content page instead of cycling back.
      */
      (function () {
        let activeGalleryId = null;
        let lightboxImageClicks = 0;

        const triggers = document.querySelectorAll(".gallery-trigger");

        triggers.forEach((trigger) => {
          trigger.addEventListener("click", () => {
            activeGalleryId = trigger.dataset.gallery;
            lightboxImageClicks = 0;
          });
        });

        document.addEventListener(
          "click",
          (event) => {
            if (!activeGalleryId) return;

            const popup = event.target.closest(".poptrox-popup");
            if (!popup) return;

            if (event.target.closest(".closer, .nav-previous, .nav-next"))
              return;

            const clickedImage = event.target.closest("img");
            if (!clickedImage) return;

            const gallery = document.getElementById(
              "gallery-" + activeGalleryId,
            );
            if (!gallery) return;

            const galleryImages = gallery.querySelectorAll("article a");
            const targetUrl = gallery.dataset.linkHref;

            lightboxImageClicks += 1;

            if (targetUrl && lightboxImageClicks >= galleryImages.length) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              window.location.href = targetUrl;
            }
          },
          true,
        );

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            activeGalleryId = null;
            lightboxImageClicks = 0;
          }
        });
      })();
    </script>
